name: Algidy Release CI

on:
  push:
    tags:
      - 'v*'      # Trigger on tags like v1.0.0
      - 'beta*'   # Trigger on tags like beta-0.1

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grant permission to create releases
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      # Decode Keystore from Secrets
      - name: Decode Keystore
        if: "${{ secrets.KEYSTORE_BASE64 != '' }}"
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > release.jks

      # Create keystore.properties from Secrets
      - name: Create keystore.properties
        if: "${{ secrets.KEYSTORE_BASE64 != '' }}"
        run: |
          echo "storeFile=release.jks" > keystore.properties
          echo "storePassword=${{ secrets.KEYSTORE_PASSWORD }}" >> keystore.properties
          echo "keyAlias=${{ secrets.KEY_ALIAS }}" >> keystore.properties
          echo "keyPassword=${{ secrets.KEY_PASSWORD }}" >> keystore.properties

      - name: Build Optimized APK
        run: ./gradlew :app:assembleRelease

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/release/Algidy_release_v*.apk
          # Automatically mark as pre-release if the tag contains "beta"
          prerelease: ${{ contains(github.ref, 'beta') }}
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
